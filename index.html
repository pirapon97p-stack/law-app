<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประมวลกฎหมายอาญา</title>
    <!-- ป้องกัน Safari บน iOS จำ Cache ไฟล์เก่า -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        select, input, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-primary {
            background-color: #3b82f6;
            color: white;
            border: none;
        }
        .btn-secondary {
            background-color: #4b5563;
            color: white;
            border: none;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            text-align: left;
        }
        .card h3 {
            margin-top: 0;
            color: #1e3a8a;
        }
        .card-text {
            white-space: pre-line;
            line-height: 1.6;
        }
        .card-elements {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8fafc;
            border-left: 4px solid #3b82f6;
            white-space: pre-line;
            font-size: 0.95em;
        }
        #loading {
            font-size: 18px;
            color: #666;
            margin: 40px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚖️ ประมวลกฎหมายอาญา</h2>
        
        <!-- ข้อความแจ้งเตือนขณะกำลังโหลด -->
        <div id="loading">กำลังโหลด...</div>

        <!-- ส่วนของเครื่องมือค้นหา (จะซ่อนอยู่จนกว่าข้อมูลจะโหลดเสร็จ) -->
        <div id="app-content" style="display: none;">
            <div class="controls">
                <select id="bookFilter">
                    <option value="">-- แสดงทุกภาค --</option>
                    <option value="ภาค 1 บทบัญญัติทั่วไป">ภาค 1 บทบัญญัติทั่วไป</option>
                </select>

                <input type="text" id="searchInput" placeholder="ค้นหาเลขมาตรา, ชื่อเรื่อง หรือคีย์เวิร์ด...">

                <div class="btn-group">
                    <button class="btn-primary" id="btnRandom">🎲 สุ่มมาตรา (ตามภาคที่เลือก)</button>
                    <button class="btn-secondary" id="btnClear">🔄 ล้างการค้นหา</button>
                </div>
            </div>

            <!-- รายการแสดงมาตรา -->
            <div id="lawList"></div>
        </div>
    </div>

    <!-- โหลดไฟล์ข้อมูล lawData.js ก่อน script.js เสมอ -->
    <script src="lawData.js"></script>
    <script src="script.js"></script>
</body>
</html>
